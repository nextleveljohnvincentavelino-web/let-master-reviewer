<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LET Master Reviewer — 450 Items</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--bg:#0f172a;--surface:#1e293b;--line:#334155;--text:#f8fafc;--muted:#a8b4c7;--green:#10b981;--mint:#a7f3d0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
    .wrap{width:min(440px,90%);margin:80px auto}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px}
    h1{font-size:1.6rem;margin-top:0}
    .field{display:grid;gap:6px;margin-bottom:14px}
    label{font-size:0.8rem;color:var(--muted);font-weight:600}
    input{width:100%;border:1px solid var(--line);background:#0f1a2a;color:var(--text);border-radius:10px;padding:12px}
    .btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:700;background:var(--green);color:#06261b;cursor:pointer;margin-top:8px}
    .toggle-box{margin-top:16px;font-size:0.85rem;color:var(--muted);text-align:center}
    .toggle-btn{color:var(--mint);font-weight:bold;cursor:pointer;text-decoration:underline;margin-left:4px}
    .error{color:#ef4444;font-size:0.8rem;margin-bottom:10px}
    #app-content{display:none;padding:40px;text-align:center}
  </style>
</head>
<body>

<div class="wrap" id="auth-wrap">
  <div class="card" id="auth-card">
    <h1 id="auth-title">Sign In</h1>
    <div id="auth-error" class="error"></div>
    <form id="auth-form">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="user@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="auth-btn">Sign In</button>
    </form>
    <div class="toggle-box">
      <span id="toggle-text">Don't have an account?</span>
      <span class="toggle-btn" id="toggle-auth">Sign Up</span>
    </div>
  </div>
</div>

<div id="app-content">
  <h1>Welcome to LET Master Reviewer</h1>
  <p id="user-display-email"></p>
  <button class="btn" style="width:200px;margin:20px auto;" id="logout-btn">Sign Out</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDl2e4OOfTwOdcAPVIG1hbIMaEuEhrgeLE",
    authDomain: "let-master-reviewer.firebaseapp.com",
    projectId: "let-master-reviewer",
    storageBucket: "let-master-reviewer.firebasestorage.app",
    messagingSenderId: "994646702581",
    appId: "1:994646702581:web:2a356aaedaaec6f0c85c2d"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let isSignUp = false;
  const authTitle = document.getElementById('auth-title');
  const authBtn = document.getElementById('auth-btn');
  const toggleAuth = document.getElementById('toggle-auth');
  const toggleText = document.getElementById('toggle-text');
  const authError = document.getElementById('auth-error');
  const authWrap = document.getElementById('auth-wrap');
  const appContent = document.getElementById('app-content');
  const userDisplayEmail = document.getElementById('user-display-email');
  const logoutBtn = document.getElementById('logout-btn');

  // Toggle between Sign In and Sign Up
  toggleAuth.addEventListener('click', () => {
    isSignUp = !isSignUp;
    authTitle.innerText = isSignUp ? 'Create Account' : 'Sign In';
    authBtn.innerText = isSignUp ? 'Sign Up' : 'Sign In';
    toggleText.innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
    toggleAuth.innerText = isSignUp ? 'Sign In' : 'Sign Up';
    authError.innerText = '';
  });

  // Handle Form Submission
  document.getElementById('auth-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    authError.innerText = '';

    try {
      if (isSignUp) {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('users').doc(userCred.user.uid).set({
          email: email,
          createdAt: new Date(),
          progress: {}
        });
      } else {
        await auth.signInWithEmailAndPassword(email, password);
      }
    } catch (err) {
      authError.innerText = err.message;
    }
  });

  // Listen for Authentication State Changes
  auth.onAuthStateChanged((user) => {
    if (user) {
      authWrap.style.display = 'none';
      appContent.style.display = 'block';
      userDisplayEmail.innerText = `Logged in as: ${user.email}`;
    } else {
      authWrap.style.display = 'block';
      appContent.style.display = 'none';
    }
  });

  // Handle Sign Out
  logoutBtn.addEventListener('click', () => {
    auth.signOut();
  });
</script>

</body>
</html>
